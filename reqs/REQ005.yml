text: |
  Le système doit indiquer si l'accès est accepté ou refusé[cite: 20] :
  - Accès accepté : allumage de la LED verte (broche 4) et message d'autorisation sur le moniteur série.
  - Accès refusé : allumage de la LED rouge (broche 5) pendant 1 seconde et message de refus sur le moniteur série.
