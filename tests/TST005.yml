  Date : 18/11/2026
  OPERATEUR : Maika

  Vérifier que le système indique si l'accès est accepté ou refusé à l'aide des hublots.

  1. Présenter un identifiant connu : vérifier que le hublot vert s'allume lorsque l'empreinte est reconnu  (accès accepté).
  2. Présenter un identifiant inconnu : vérifier que le hublot bleu s'allume lorsque l'empreinte n'est pas reconnu (accès refusé).

