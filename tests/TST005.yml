resultat observé: |
  Quand l’empreinte enregistrée est reconnue, le relais SRD-05VDC-SL-C commandé par la broche D7 bascule. Le contact COM–NO se ferme et le hublot vert Legrand 0 785 62, alimenté en 12 V, s’allume. Le second hublot, câblé sur NC, est éteint pendant ce temps. Le hublot vert s’éteint au bout de 2 s, quand le relais revient au repos.
